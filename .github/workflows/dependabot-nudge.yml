name: Weekly Dependabot Nudge
on:
  schedule:
    # Run at 17 UTC (9-ish am Pacific) every Monday
    - cron: "0 17 * * 1"
  workflow_dispatch:
permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    # Toolchain (node, pnpm, baked dependency store) comes from the
    # prebuilt image, so the scheduled jobs install nothing from the
    # network at job time (see brave/security-action#1047).
    container:
      image: ghcr.io/brave/security-action:latest
    steps:
      - name: dependabot nudge
        uses: brave/security-action/actions/dependabot-nudge@main
        with:
          github_token: ${{ secrets.DEPENDABOT_NUDGE_GITHUB_TOKEN }}
          slack_token: ${{ secrets.HOTSPOTS_SLACK_TOKEN }}
          gh_to_slack_user_map: ${{ secrets.GH_TO_SLACK_USER_MAP }}
          debug: false
