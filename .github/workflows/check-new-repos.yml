name: Check New Repos
on:
  schedule:
    # nightly (0th hour 0th minute of every day)
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    # Toolchain (node, pnpm, baked dependency store) comes from the
    # prebuilt image, so the scheduled jobs install nothing from the
    # network at job time (see brave/security-action#1047).
    container:
      image: ghcr.io/brave/security-action:latest
    steps:
      - name: check new repos
        uses: brave/security-action/actions/check-new-repos@main
        with:
          github_token: ${{ secrets.ORG_READ_GITHUB_TOKEN }}
          slack_token: ${{ secrets.HOTSPOTS_SLACK_TOKEN }}
          debug: false
