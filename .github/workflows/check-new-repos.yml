name: Check New Repos
on:
  schedule:
    # nightly (0th hour 0th minute of every day)
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions: {}
env:
  SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_WORKFLOWS_CHECK_NEW_REPOS }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: sentry cron check-in
        uses: brave/security-action/actions/sentry-cron@main
        with:
          monitor: workflows-check-new-repos
          status: in_progress
          schedule: '0 0 * * *'
          checkin_margin: '60'
      - name: check new repos
        uses: brave/security-action/actions/check-new-repos@main
        with:
          github_token: ${{ secrets.ORG_READ_GITHUB_TOKEN }}
          slack_token: ${{ secrets.HOTSPOTS_SLACK_TOKEN }}
          debug: false
      - name: sentry cron ok
        if: success()
        uses: brave/security-action/actions/sentry-cron@main
        with:
          monitor: workflows-check-new-repos
          status: ok
      - name: sentry cron error
        if: failure()
        uses: brave/security-action/actions/sentry-cron@main
        with:
          monitor: workflows-check-new-repos
          status: error