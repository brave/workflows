name: Copy repo secrets to org secrets
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions: {}
env:
  SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_WORKFLOWS_COPY_REPO_SECRETS_TO_ORG_SECRETS }}

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: sentry cron check-in
        uses: brave/security-action/actions/sentry-cron@main
        with:
          monitor: workflows-copy-repo-secrets-to-org-secrets
          status: in_progress
          schedule: '30 1 * * *'
          checkin_margin: '60'
      - env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_MANAGER_TOKEN }}
          GH_TO_SLACK_USER_MAP: ${{ secrets.GH_TO_SLACK_USER_MAP }}
        run: gh secret set GH_TO_SLACK_USER_MAP -o "${GITHUB_REPOSITORY_OWNER:?}" -v all <<<"${GH_TO_SLACK_USER_MAP:?}"
      - name: sentry cron ok
        if: success()
        uses: brave/security-action/actions/sentry-cron@main
        with:
          monitor: workflows-copy-repo-secrets-to-org-secrets
          status: ok
      - name: sentry cron error
        if: failure()
        uses: brave/security-action/actions/sentry-cron@main
        with:
          monitor: workflows-copy-repo-secrets-to-org-secrets
          status: error