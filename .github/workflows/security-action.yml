name: security
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, staging, development, devel, dev]
  merge_group:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    # Prebuilt runtime image (ghcr.io/brave/security-action, built by
    # brave/security-action .github/workflows/image.yml): every tool the
    # action needs is baked — no setup-python/setup-uv/pnpm/corepack/
    # opengrep/landrun/reviewdog downloads and no apt from the flaky
    # azure.archive.ubuntu.com mirrors (actions/runner-images#14823).
    # Floating tag on purpose; the image is rebuilt on every push that
    # changes the baked toolchain.
    container:
      image: ghcr.io/brave/security-action:latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: brave/security-action/actions/main@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_token: ${{ secrets.HOTSPOTS_SLACK_TOKEN }}
          gh_to_slack_user_map: ${{ secrets.GH_TO_SLACK_USER_MAP }}
