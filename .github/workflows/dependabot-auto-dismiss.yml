name: Weekly Dependabot Auto Dismiss
on:
  schedule:
    # Run at 24:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    # Toolchain (node, pnpm, baked dependency store) comes from the
    # prebuilt image, so the scheduled jobs install nothing from the
    # network at job time (see brave/security-action#1047).
    container:
      image: ghcr.io/brave/security-action:latest
    steps:
      - name: dependabot auto dismiss
        uses: brave/security-action/actions/dependabot-auto-dismiss@main
        with:
          github_token: ${{ secrets.DEPENDABOT_AUTO_DISMISS_GITHUB_TOKEN }}
          slack_token: ${{ secrets.HOTSPOTS_SLACK_TOKEN }}
          debug: false
