name: puLL-Merge
on:
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize', 'ready_for_review']
  merge_group:
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  pull-merge:
    concurrency:
      group: ${{ github.head_ref }}-init
      cancel-in-progress: true
    name: puLL-Merge
    runs-on: ubuntu-24.04
    # Prebuilt runtime image (ghcr.io/brave/pull-merge, built by
    # brave/pull-merge .github/workflows/image.yml): node, pnpm,
    # patchutils/filterdiff and node_modules are baked — no setup-node
    # tarball, no apt patchutils install, no npm registry dependency on
    # the happy path (actions/runner-images#14823).
    # Floating tag on purpose; the image is rebuilt on every push that
    # changes the baked toolchain.
    container:
      image: ghcr.io/brave/pull-merge:latest
    strategy:
      fail-fast: false
    steps:
      - uses: brave/pull-merge@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bedrock_aws_iam_role_arn: ${{ secrets.SECURITY_BEDROCK_AWS_IAM_ROLE_ARN }}
          region: us-west-2
